name: CI
on: [push, pull_request]
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    linux:
        strategy:
            fail-fast: false
            matrix:
                # Each architecture runs the suite twice: JDK 25 covers JNI and FFM,
                # the JDK 11 leg is the `--release 8` floor check and ships nothing.
                include: [
                    { os: ubuntu-latest, target: linux/amd64, java: 25, deploy: true  },
                    { os: ubuntu-latest, target: linux/amd64, java: 11, deploy: false }
                ]
        runs-on: ${{ matrix.os }}
        steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v5
          with:
            java-version: ${{ matrix.java }}
            distribution: zulu

        - name: Install sbt-java-module-info
          run: pushd ./sbt-java-module-info; ./sbt publishLocal; popd

        - name: Compile
          run: ./sbt compile

        - name: Env
          run: echo "nativeJniVersion=`cat version`" >> $GITHUB_ENV

        - name: Inspect
          run: ldd target/classes/${{ matrix.target }}/libzstd-jni-${nativeJniVersion}.so

        - name: Test (JNI)
          run: ./sbt jacoco

        # The same suite against the FFM implementation: -Dzstd.ffm=true makes sbt
        # prepend target/classes/META-INF/versions/22 to the test classpath, so the
        # versioned classes shadow their base counterparts and everything not yet
        # ported still resolves to the JNI one - the same mix a real MR jar gives.
        # It has to be a second sbt process: the property is read while build.sbt is
        # evaluated, and a JNI library can only be System.load-ed by one classloader
        # per JVM.
        - name: Test (FFM)
          if: ${{ matrix.java == 25 }}
          run: ./sbt -Dzstd.ffm=true test

        - name: Upload coverage
          uses: codecov/codecov-action@v7

        - name: Deploy
          if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.deploy }}
          env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: "us-east-1"
          run: aws s3 cp --recursive target/classes/${{ matrix.target }} s3://zstd-jni/github/${{ matrix.target }}

    macos:
        strategy:
            fail-fast: false
            matrix:
                include: [
                  { os: macos-15-intel, host_arch: x86_64,  java: 25, deploy: true,  target_arch: x86_64  },
                  { os: macos-15-intel, host_arch: x86_64,  java: 11, deploy: false, target_arch: x86_64  },
                  { os: macos-latest,   host_arch: aarch64, java: 25, deploy: true,  target_arch: aarch64 },
                  { os: macos-latest,   host_arch: aarch64, java: 11, deploy: false, target_arch: aarch64 }
                ]
        runs-on: ${{ matrix.os }}
        steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v5
          with:
            java-version: ${{ matrix.java }}
            distribution: zulu
        - uses: maxim-lobanov/setup-xcode@v1
          with:
            xcode-version: latest

        - name: Inspect arch
          run: arch

        - name: Install sbt-java-module-info
          run: pushd ./sbt-java-module-info; ./sbt publishLocal; popd

        - name: Compile
          run: ./sbt compile

        - name: Env
          run: echo "nativeJniVersion=`cat version`" >> $GITHUB_ENV

        - name: Inspect classes
          run: ls -al target/classes/darwin

        - name: Inspect
          run: otool -L target/classes/darwin/${{ matrix.target_arch }}/libzstd-jni-${nativeJniVersion}.dylib

        - name: Symbols
          run: nm -m target/classes/darwin/${{ matrix.target_arch }}/libzstd-jni-${nativeJniVersion}.dylib

        - name: Test (JNI)
          run: ./sbt test

        - name: Test (FFM)
          if: ${{ matrix.java == 25 }}
          run: ./sbt -Dzstd.ffm=true test

        - name: Upload coverage
          uses: codecov/codecov-action@v7

        - name: Deploy
          if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.deploy }}
          env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: "us-east-1"
          run: aws s3 cp --recursive target/classes/darwin/${{ matrix.host_arch }} s3://zstd-jni/github/darwin/${{ matrix.target_arch }}

    windows:
        strategy:
            fail-fast: false
            matrix:
                # win/x86 is 11-only: the Windows 32-bit x86 port was removed in
                # JDK 24 (JEP 479) and Zulu shipped its last win_i686 build for 11,
                # so there is no JVM on that platform that can run the FFM path.
                # It is therefore also the leg that deploys win/x86, even though it
                # is a JDK 11 leg - hence the explicit `deploy` flag.
                include: [
                    { msystem: MINGW64, arch: x86_64, java_arch: x64, java: 25, deploy: true,  target: 'win\amd64', s3_path: win/amd64 },
                    { msystem: MINGW64, arch: x86_64, java_arch: x64, java: 11, deploy: false, target: 'win\amd64', s3_path: win/amd64 },
                    { msystem: MINGW32, arch: i686,   java_arch: x86, java: 11, deploy: true,  target: 'win\x86',   s3_path: win/x86 }
                ]
        runs-on: windows-latest
        defaults:
            run:
                shell: msys2 {0}
        steps:
        - uses: actions/checkout@v7
        - uses: msys2/setup-msys2@v2
          with:
            msystem: ${{ matrix.msystem }}
            install: git base-devel mingw-w64-${{ matrix.arch }}-toolchain
            path-type: inherit
            update: true
        - uses: actions/setup-java@v5
          with:
            java-version: ${{ matrix.java }}
            distribution: zulu
            architecture: ${{ matrix.java_arch }}

        - name: Check Java version
          run: java -version

        - name: Install sbt-java-module-info
          run: cd ./sbt-java-module-info; ./sbt publishLocal

        - name: Compile
          run: ./sbt compile

        - name: Test (JNI)
          run: ./sbt test

        - name: Test (FFM)
          if: ${{ matrix.java == 25 }}
          run: ./sbt -Dzstd.ffm=true test

        - name: Upload coverage
          uses: codecov/codecov-action@v7

        - name: Deploy
          if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.deploy }}
          shell: cmd
          env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: "us-east-1"
          run: 'aws s3 cp --recursive target\classes\${{ matrix.target }} s3://zstd-jni/github/${{ matrix.s3_path }}'

    windows-cross:
        runs-on: windows-latest
        defaults:
            run:
                shell: msys2 {0}
        steps:
        - uses: actions/checkout@v7
        - uses: msys2/setup-msys2@v2
          with:
            msystem: mingw64
            install: git base-devel mingw-w64-cross-clang
            path-type: inherit
            update: true

        - name: Compile
          # -DZSTD_DLL_EXPORT=1 puts the ZSTD_* symbols in the DLL export table,
          # where the FFM implementation looks them up - see the Windows branch of
          # jniGccFlags in build.sbt for why the version script cannot do it here.
          run: /opt/aarch64-w64-mingw32/bin/aarch64-w64-mingw32-clang -shared -D_JNI_IMPLEMENTATION_ -Wl,--kill-at -DZSTD_DLL_EXPORT=1 -O3 -DZSTD_MULTITHREAD=1 -I./src/windows/include -I./jni -I./src/main/native -I./src/main/native/common -std=c99 -o libzstd-jni-$(cat version).dll ./src/main/native/*.c ./src/main/native/common/*.c ./src/main/native/compress/*.c ./src/main/native/decompress/*.[cS] ./src/main/native/dictBuilder/*.c

        - name: Deploy
          if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master'}}
          env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: "us-east-1"
          run: aws s3 cp libzstd-jni-$(cat version).dll s3://zstd-jni/github/win/aarch64/libzstd-jni-$(cat version).dll

    android:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v5
          with:
            java-version: 17
            distribution: zulu
        - uses: android-actions/setup-android@v4
        - name: Install Android SDK components
          run: sdkmanager --install "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"

        - name: Install sbt-java-module-info
          run: pushd ./sbt-java-module-info; ./sbt publishLocal; popd

        - name: Build AAR
          run: ./sbt aarTask

    multi-release-jar:
        # The other FFM tests put the versioned *directory* on the classpath, which
        # says nothing about whether the packaged jars resolve correctly. This job
        # builds them and checks that they do - every classified jar too, since
        # build.sbt sets the Multi-Release attribute per config. Separate from
        # `linux` because it is a property of the artifacts, not of a platform.
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v5
          with:
            # Must be 22+, or ffmCompile skips and there are no versioned classes
            # to check at all.
            java-version: 25
            distribution: zulu

        - name: Install sbt-java-module-info
          run: pushd ./sbt-java-module-info; ./sbt publishLocal; popd

        # The classified jars whose native library is built on another platform
        # come out without it; the check only looks at classes and the manifest.
        - name: Package
          run: ./sbt package packageClassified

        - name: Verify multi-release dispatch
          run: ./.github/scripts/check-multi-release-jar.sh
