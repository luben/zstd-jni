name: "CI qemu cross"
on: [push, pull_request]
# The most expensive job in the repo, and until now the only workflow without a
# concurrency group - so a push superseded by another one kept its s390x run.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    qemu-cross:
        strategy:
            # One slow guest should not cancel the others.
            fail-fast: false
            matrix:
                include: [
                    { platform: linux/s390x, image: "s390x/eclipse-temurin:25-jdk-noble" },
                    # 32-bit: no specialized ABI linker, so FFM falls back to
                    # libffi's FallbackLinker with a 4-byte size_t - the only
                    # place ZstdBinding's size_t adaptation is exercised. A distro
                    # JDK, as Temurin and Zulu ship no 32-bit build past 21, and
                    # a slow one: Debian's 32-bit builds are Zero, so no JIT.
                    # Runs natively on the x86_64 runner despite the workflow name.
                    { platform: linux/386, image: "i386/debian:trixie" }
                ]
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: docker/setup-qemu-action@v4

        - name: ${{ matrix.platform }} build and test
          uses: ./.github/actions/qemu-cross
          with:
            platform: ${{ matrix.platform }}
            image: ${{ matrix.image }}
