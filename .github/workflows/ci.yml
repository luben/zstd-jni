name: CI
on: [push, pull_request]
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Every platform builds and packages once, on JDK 25 - the version the released
# jars are built with - and then runs the suite three times against that one jar,
# changing only the JVM underneath it:
#
#   JDK 25, jar as shipped                        -> FFM  (META-INF/versions/22)
#   JDK 25, -Djdk.util.jar.enableMultiRelease=false -> JNI  (a shaded fat jar that
#                                                            lost the attribute)
#   JDK 11, jar as shipped                        -> JNI  (the 8-21 floor)
#
# check-multi-release-jar.sh runs first and is what makes the FFM run meaningful:
# without it a jar built with no versioned classes would resolve to the base copy
# and pass. This replaces the old arrangement, where a second JDK 11 matrix leg
# rebuilt everything and the FFM leg prepended META-INF/versions/22 to the test
# classpath as a directory - which cannot exercise Multi-Release dispatch at all,
# because a directory entry only ever resolves the base name.
jobs:
    linux:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - id: jdk11
          uses: actions/setup-java@v5
          with:
            java-version: 11
            distribution: zulu
        # Last one wins for JAVA_HOME, so this is what sbt builds with.
        - id: jdk25
          uses: actions/setup-java@v5
          with:
            java-version: 25
            distribution: zulu

        - name: Install sbt-java-module-info
          run: pushd ./sbt-java-module-info; ./sbt publishLocal; popd

        - name: Compile
          run: ./sbt compile

        - name: Env
          run: echo "nativeJniVersion=`cat version`" >> $GITHUB_ENV

        - name: Inspect
          run: ldd target/classes/linux/amd64/libzstd-jni-${nativeJniVersion}.so

        # Coverage has to come off target/classes: sbt-jacoco instruments that
        # directory offline, so it cannot be collected from a jar run. It is
        # therefore JNI-only, and collected on this platform alone.
        - name: Test and collect coverage (JNI)
          run: ./sbt jacoco

        # packageClassified only here - the classified jars are the published
        # artifacts and every one of them has to carry the manifest attribute,
        # but that is a property of the build, not of the platform.
        - name: Package
          run: ./sbt Test/compile package packageClassified

        - name: Verify multi-release dispatch
          run: ./.github/scripts/check-multi-release-jar.sh

        - name: Test from jar (JDK 25, FFM)
          run: ./.github/scripts/run-tests-from-jar.sh "${{ steps.jdk25.outputs.path }}"

        - name: Test from jar (JDK 25, JNI)
          run: ./.github/scripts/run-tests-from-jar.sh "${{ steps.jdk25.outputs.path }}" -Djdk.util.jar.enableMultiRelease=false

        - name: Test from jar (JDK 11, JNI)
          run: ./.github/scripts/run-tests-from-jar.sh "${{ steps.jdk11.outputs.path }}"

        - name: Upload coverage
          uses: codecov/codecov-action@v7

        - name: Deploy
          if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: "us-east-1"
          run: aws s3 cp --recursive target/classes/linux/amd64 s3://zstd-jni/github/linux/amd64

    macos:
        strategy:
            fail-fast: false
            matrix:
                include: [
                  { os: macos-15-intel, host_arch: x86_64,  target_arch: x86_64  },
                  { os: macos-latest,   host_arch: aarch64, target_arch: aarch64 }
                ]
        runs-on: ${{ matrix.os }}
        steps:
        - uses: actions/checkout@v7
        - id: jdk11
          uses: actions/setup-java@v5
          with:
            java-version: 11
            distribution: zulu
        - id: jdk25
          uses: actions/setup-java@v5
          with:
            java-version: 25
            distribution: zulu
        - uses: maxim-lobanov/setup-xcode@v1
          with:
            xcode-version: latest

        - name: Inspect arch
          run: arch

        - name: Install sbt-java-module-info
          run: pushd ./sbt-java-module-info; ./sbt publishLocal; popd

        - name: Compile
          run: ./sbt compile

        - name: Env
          run: echo "nativeJniVersion=`cat version`" >> $GITHUB_ENV

        - name: Inspect
          run: otool -L target/classes/darwin/${{ matrix.target_arch }}/libzstd-jni-${nativeJniVersion}.dylib

        - name: Symbols
          run: nm -m target/classes/darwin/${{ matrix.target_arch }}/libzstd-jni-${nativeJniVersion}.dylib

        - name: Package
          run: ./sbt Test/compile package

        - name: Verify multi-release dispatch
          run: ./.github/scripts/check-multi-release-jar.sh target/zstd-jni-$(cat version).jar

        - name: Test from jar (JDK 25, FFM)
          run: ./.github/scripts/run-tests-from-jar.sh "${{ steps.jdk25.outputs.path }}"

        - name: Test from jar (JDK 25, JNI)
          run: ./.github/scripts/run-tests-from-jar.sh "${{ steps.jdk25.outputs.path }}" -Djdk.util.jar.enableMultiRelease=false

        - name: Test from jar (JDK 11, JNI)
          run: ./.github/scripts/run-tests-from-jar.sh "${{ steps.jdk11.outputs.path }}"

        - name: Deploy
          if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: "us-east-1"
          run: aws s3 cp --recursive target/classes/darwin/${{ matrix.host_arch }} s3://zstd-jni/github/darwin/${{ matrix.target_arch }}

    windows:
        runs-on: windows-latest
        defaults:
            run:
                shell: msys2 {0}
        steps:
        - uses: actions/checkout@v7
        - uses: msys2/setup-msys2@v2
          with:
            msystem: MINGW64
            install: git base-devel mingw-w64-x86_64-toolchain
            path-type: inherit
            update: true
        - id: jdk11
          uses: actions/setup-java@v5
          with:
            java-version: 11
            distribution: zulu
            architecture: x64
        - id: jdk25
          uses: actions/setup-java@v5
          with:
            java-version: 25
            distribution: zulu
            architecture: x64

        - name: Check Java version
          run: java -version

        - name: Install sbt-java-module-info
          run: cd ./sbt-java-module-info; ./sbt publishLocal

        - name: Compile
          run: ./sbt compile

        - name: Package
          run: ./sbt Test/compile package

        - name: Verify multi-release dispatch
          run: ./.github/scripts/check-multi-release-jar.sh target/zstd-jni-$(cat version).jar

        - name: Test from jar (JDK 25, FFM)
          run: ./.github/scripts/run-tests-from-jar.sh "${{ steps.jdk25.outputs.path }}"

        - name: Test from jar (JDK 25, JNI)
          run: ./.github/scripts/run-tests-from-jar.sh "${{ steps.jdk25.outputs.path }}" -Djdk.util.jar.enableMultiRelease=false

        - name: Test from jar (JDK 11, JNI)
          run: ./.github/scripts/run-tests-from-jar.sh "${{ steps.jdk11.outputs.path }}"

        - name: Deploy
          if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          shell: cmd
          env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: "us-east-1"
          run: 'aws s3 cp --recursive target\classes\win\amd64 s3://zstd-jni/github/win/amd64'

    windows-x86:
        # The odd one out, and structurally so: JEP 479 removed the Windows 32-bit
        # x86 port in JDK 24 and Zulu's last win_i686 build is 11, so there is no
        # JVM here that can run the FFM path. It builds on 11, ships no versioned
        # classes, and gets the plain JNI run only.
        runs-on: windows-latest
        defaults:
            run:
                shell: msys2 {0}
        steps:
        - uses: actions/checkout@v7
        - uses: msys2/setup-msys2@v2
          with:
            msystem: MINGW32
            install: git base-devel mingw-w64-i686-toolchain
            path-type: inherit
            update: true
        - uses: actions/setup-java@v5
          with:
            java-version: 11
            distribution: zulu
            architecture: x86

        - name: Check Java version
          run: java -version

        - name: Install sbt-java-module-info
          run: cd ./sbt-java-module-info; ./sbt publishLocal

        - name: Compile
          run: ./sbt compile

        - name: Test (JNI)
          run: ./sbt test

        - name: Deploy
          if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          shell: cmd
          env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: "us-east-1"
          run: 'aws s3 cp --recursive target\classes\win\x86 s3://zstd-jni/github/win/x86'

    windows-cross:
        runs-on: windows-latest
        defaults:
            run:
                shell: msys2 {0}
        steps:
        - uses: actions/checkout@v7
        - uses: msys2/setup-msys2@v2
          with:
            msystem: mingw64
            install: git base-devel mingw-w64-cross-clang
            path-type: inherit
            update: true

        - name: Compile
          # -DZSTD_DLL_EXPORT=1 puts the ZSTD_* symbols in the DLL export table,
          # where the FFM implementation looks them up - see the Windows branch of
          # jniGccFlags in build.sbt for why the version script cannot do it here.
          run: /opt/aarch64-w64-mingw32/bin/aarch64-w64-mingw32-clang -shared -D_JNI_IMPLEMENTATION_ -Wl,--kill-at -DZSTD_DLL_EXPORT=1 -O3 -DZSTD_MULTITHREAD=1 -I./src/windows/include -I./jni -I./src/main/native -I./src/main/native/common -std=c99 -o libzstd-jni-$(cat version).dll ./src/main/native/*.c ./src/main/native/common/*.c ./src/main/native/compress/*.c ./src/main/native/decompress/*.[cS] ./src/main/native/dictBuilder/*.c

        - name: Deploy
          if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master'}}
          env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION: "us-east-1"
          run: aws s3 cp libzstd-jni-$(cat version).dll s3://zstd-jni/github/win/aarch64/libzstd-jni-$(cat version).dll

    android:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v5
          with:
            java-version: 17
            distribution: zulu
        - uses: android-actions/setup-android@v4
        - name: Install Android SDK components
          run: sdkmanager --install "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"

        - name: Install sbt-java-module-info
          run: pushd ./sbt-java-module-info; ./sbt publishLocal; popd

        - name: Build AAR
          run: ./sbt aarTask
