name: "CI qemu cross"
on: [push, pull_request]
# The most expensive job in the repo, and until now the only workflow without a
# concurrency group - so a push superseded by another one kept its s390x run.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    qemu-cross:
        strategy:
            matrix:
                include: [
                    { platform: s390x }
                ]
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
        - uses: docker/setup-qemu-action@v4

        - name: qemu ${{ matrix.platform }} build and test
          uses: ./.github/actions/qemu-cross
          with:
            platform: ${{ matrix.platform }}
