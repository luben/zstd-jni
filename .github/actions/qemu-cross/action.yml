name: 'QEMU Cross'
description: 'Compile and test under QEMU'
inputs:
  platform:
    description: 'docker --platform of the guest'
    required: true
  image:
    description: 'guest image; needs a JDK 22+ on PATH or apt-installable openjdk-25'
    required: true
runs:
  using: 'composite'
  steps:
    - run: ${{ github.action_path }}/docker.sh
      shell: bash
      env:
        PLATFORM_NAME: ${{ inputs.platform }}
        IMAGE_NAME: ${{ inputs.image }}
        HOST_WORKSPACE_DIR: ${{ github.workspace }}
